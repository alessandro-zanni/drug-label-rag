[project]
name = "api"
version = "0.1.0"
description = "RAG and agent API over public drug labels"
authors = [
    { name = "Alessandro Zanni", email = "azanni098@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.3.0",
    "boto3>=1.43.119",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pgvector>=0.5.1",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "botocore[crt]>=1.43.119",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
